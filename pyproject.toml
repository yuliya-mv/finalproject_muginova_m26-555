[project]
name = "mephi_sprint_23-61_finalproject"
version = "0.1.0"
description = "Учебный проект ValutaTrade Hub"
readme = "README.md"
authors = [
    { name = "yuliya-mv", email = "yuu.khoang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable",
    "requests",
]

[project.scripts]
project = "main:main"

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["valutatrade_hub", "main.py"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.valutatrade]
data_dir = "data"
base_currency = "USD"
rates_ttl_seconds = 300
log_file = "logs/actions.log"
log_level = "INFO"